<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>GardenMark Social Slide</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/social/social.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gm-mark" viewBox="0 0 32 32">
    <path fill="#8dc63f" d="M2.5,1 H9 A6 6 0 0 1 15,7 V13.5 Q15,15 13.5,15 H7 A6 6 0 0 1 1,9 V2.5 Q1,1 2.5,1 Z"/>
    <path fill="#5da12e" d="M18.5,1 H25 A6 6 0 0 1 31,7 V13.5 Q31,15 29.5,15 H23 A6 6 0 0 1 17,9 V2.5 Q17,1 18.5,1 Z"/>
    <path fill="#5da12e" d="M2.5,17 H9 A6 6 0 0 1 15,23 V29.5 Q15,31 13.5,31 H7 A6 6 0 0 1 1,25 V18.5 Q1,17 2.5,17 Z"/>
  </symbol>
  <symbol id="i-pin" viewBox="0 0 20 20"><path d="M10 18s6-5.5 6-10a6 6 0 10-12 0c0 4.5 6 10 6 10z M10 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="paw" viewBox="0 0 40 40"><ellipse cx="20" cy="26" rx="9" ry="8"/><ellipse cx="9" cy="15" rx="4" ry="5"/><ellipse cx="16" cy="9" rx="4" ry="5"/><ellipse cx="24" cy="9" rx="4" ry="5"/><ellipse cx="31" cy="15" rx="4" ry="5"/></symbol>
</svg>
<div id="root"></div>
<script type="module">
import { POSTS } from '/social/posts.js';
import { renderSample, MODELS } from '/src/sample.js';

const q = new URLSearchParams(location.search);
const post = POSTS[q.get('post')];
const i = Number(q.get('s') || 0);
const sl = post.slides[i];
const total = post.slides.length;
const theme = sl.theme || (sl.layout === 'cta' && post.theme === 'light' ? 'dark' : post.theme);
const brand = '<span class="brand"><svg><use href="#gm-mark"/></svg>GardenMark<sup>®</sup></span>';
const pad = (n) => String(n).padStart(2, '0');

function visual(v, cls) {
  if (!v) return '';
  if (v.type === 'sample') return `<div class="visual ${cls}"><canvas data-model="${v.model}"></canvas><span class="vcap">Rendered illustration. Not a photograph.</span></div>`;
  if (v.type === 'weeks') return `<div class="visual"><div class="weeks">${Array.from({ length: 52 }, (_, k) => `<i class="${k >= 13 && k < 44 ? 'mow' : ''}"></i>`).join('')}</div><p class="legend"><i></i>A typical mowing season</p></div>`;
  if (v.type === 'scale') {
    const order = ['montana', 'kentucky', 'augusta', 'canine'];
    return `<div class="visual"><div class="scale">${order.map((k) => `<div class="bar ${v.on.includes(k) ? 'on' : ''}"><i style="height:${(MODELS[k].pile / 1.75) * 76}%"></i><b>${k[0].toUpperCase() + k.slice(1)}</b><span>${MODELS[k].pile === 0.7 ? '0.70' : MODELS[k].pile} IN</span></div>`).join('')}</div></div>`;
  }
  if (v.type === 'paws') {
    let s = '';
    for (let k = 0; k < 6; k++) {
      const x = 110 + k * 78, y = 250 - k * 26 + (k % 2 ? 40 : 0);
      s += `<svg style="position:absolute;left:${x}px;top:${y - 120}px;width:70px;height:70px;transform:rotate(${28 + (k % 2 ? 10 : -6)}deg);color:#7a6440;opacity:${(0.95 - k * 0.14).toFixed(2)}"><use href="#paw" fill="currentColor"/></svg>`;
    }
    return `<div class="visual v-paws">${s}<canvas data-model="canine" style="top:auto;bottom:0;height:470px"></canvas><span class="vcap">Rendered illustration. Not a photograph.</span></div>`;
  }
  if (v.type === 'stack') {
    const layers = [['Turf', '#4f6f27', '#eceadf', 58], ['WeedMark fabric', '#2a2d22', '#b6b6a0', 58], ['1–2 in stone dust or concrete sand', '#cbbf96', '#191c12', 66], ['3–4 in of 3/4 in crushed stone', '#8a876f', '#191c12', 100], ['Compacted, sloped base', '#5c5a48', '#eceadf', 58]];
    return `<div class="stack">${layers.map(([t, bg, fg, h]) => `<div style="background:${bg};color:${fg};height:${h}px">${t}</div>`).join('')}</div>`;
  }
  return '';
}

const L = sl.layout;
const label = sl.label ? `<p class="label">${sl.label}</p>` : '';
const body = sl.body ? `<p class="body">${sl.body}</p>` : '';
const chips = sl.visual && sl.visual.swatches ? `<div class="chips">${MODELS[sl.visual.model].greens.map((c, k) => `<div><i style="background:${c}"></i>${['Deep', 'Mid', 'Light'][k]}</div>`).join('')}</div>` : '';
let inner = '';
if (L === 'hook') inner = `<div class="copy center">${label}<h1>${sl.h}</h1>${body}</div>${visual(sl.visual, 'v-hook')}`;
else if (L === 'split') inner = `${visual(sl.visual, 'v-split')}<div class="copy">${label}<h2>${sl.h}</h2>${body}${chips}</div>`;
else if (L === 'photo') inner = `<div class="photo"><img src="${sl.src}" alt=""><span class="tag">GardenMark project</span></div><div class="copy"><h2>${sl.h}</h2>${body}</div>`;
else if (L === 'text') inner = `<div class="copy">${label}<h1>${sl.h}</h1>${body}</div>`;
else if (L === 'q') inner = `<div class="copy"><p class="qnum">${sl.n}</p><h2>${sl.h}</h2>${body}${sl.visual && sl.visual.type === 'stack' ? visual(sl.visual) : ''}</div>${sl.visual && sl.visual.type === 'sample' ? visual(sl.visual, 'v-q') : ''}<div class="qprog"><span class="mono">Question ${Number(sl.n)} of 5</span><div>${[1,2,3,4,5].map(k => `<i class="${k <= Number(sl.n) ? 'on' : ''}"></i>`).join('')}</div></div>`;
else if (L === 'list') inner = `<div class="copy">${label}<h1>${sl.h}</h1><ul class="list">${sl.items.map((t, k) => `<li><b>${pad(k + 1)}</b>${t}</li>`).join('')}</ul></div>`;
else if (L === 'cta') inner = `<div class="copy"><span class="mark"><svg><use href="#gm-mark"/></svg></span><h2>${sl.h}</h2><span class="btn"><svg><use href="#i-pin"/></svg>Find a GardenMark dealer</span><p class="mono url">gardenmark.com</p></div>`;

const swipe = (i === 0 || sl.swipe) && i < total - 1;
document.getElementById('root').innerHTML = `<section class="slide ${theme} l-${L}">
  <div class="top">${L === 'cta' ? '<span></span>' : brand}<span class="mono count">${pad(i + 1)} / ${pad(total)}</span></div>
  <div class="stage">${inner}</div>
  <div class="bottom"><span class="mono url">${L === 'cta' ? '' : 'gardenmark.com'}</span>${swipe ? '<span class="mono swipe">Swipe<i></i></span>' : '<span></span>'}</div>
</section>`;

await document.fonts.ready;
// Headlines keep their hand-set lines. Report (don't silently shrink) any line that would overflow.
window.__shrunk = [];
document.querySelectorAll('h1, h2').forEach((h) => {
  const max = 1080 - 160;
  let fs = parseFloat(getComputedStyle(h).fontSize); const start = fs;
  while (h.scrollWidth > max && fs > 40) { fs -= 2; h.style.fontSize = fs + 'px'; }
  if (fs !== start) window.__shrunk.push(`${h.textContent.slice(0, 30)} ${start}->${fs}`);
});
const SOPTS = { padX: 0.085, padY: 0.06, dof: 2.8, seed: 21 };
document.querySelectorAll('canvas').forEach((c) => {
  const v = sl.visual;
  if (v.type === 'paws') renderSample(c, 'canine', { ...SOPTS, yaw: -14, pitch: 22, width: 14, depth: 8 });
  else renderSample(c, v.model, { ...SOPTS, yaw: v.yaw, pitch: v.pitch, width: 12, depth: 9 });
});
window.__ready = true;
</script>
</body>
</html>
